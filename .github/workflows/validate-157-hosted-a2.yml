name: Validate PathMC 157 hosted attempt 2

on:
  push:
    branches: [validate-issue-157-hosted-a2b]

permissions:
  contents: read

concurrency:
  group: pathmc157-hosted-a2b
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GIT_TERMINAL_PROMPT: "0"

jobs:
  merge-lint:
    name: merge-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout packet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: packet
      - name: Checkout upstream
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pymc-labs/pathmc
          ref: 558fa990ca569708a542284e9c166dae136be4bd
          fetch-depth: 0
          persist-credentials: false
          path: upstream
      - id: py
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Mark job start
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py"
          mark-start --evidence "$RUNNER_TEMP/pathmc157"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: false
      - id: prepare
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" prepare-candidate
          --repo "$GITHUB_WORKSPACE/upstream" --patch "$GITHUB_WORKSPACE/packet/validation/pathmc157/candidate-157.patch" --job-budget-s 3180 --reserve-s 240 --evidence "$RUNNER_TEMP/pathmc157/prepare"
      - id: sync
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" run-phase
          --name sync --cwd "$GITHUB_WORKSPACE/upstream" --timeout-s 420 --job-budget-s 3180 --reserve-s 240 --evidence "$RUNNER_TEMP/pathmc157/sync" -- uv sync --all-extras --locked
      - id: early_help
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" run-phase
          --name early-help --cwd "$GITHUB_WORKSPACE/upstream" --timeout-s 30 --job-budget-s 3180 --reserve-s 240 --evidence "$RUNNER_TEMP/pathmc157/early-help" -- uv run --locked --all-extras python -c
          "import pathmc, pathmc.sensitivity; help(pathmc.sensitivity); help(pathmc.PathModel.sensitivity)"
      - id: early_tests
        if: steps.early_help.outcome == 'success'
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" test-run
          --repo "$GITHUB_WORKSPACE/upstream" --evidence "$RUNNER_TEMP/pathmc157/early-tests" --name early-tests --shard smoke --smoke --job-budget-s 3180 --reserve-s 240 --file tests/test_sensitivity.py
      - id: smoke
        if: steps.early_tests.outcome == 'success'
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" run-phase
          --name smoke --cwd "$GITHUB_WORKSPACE/upstream" --timeout-s 300 --job-budget-s 3180 --reserve-s 240 --evidence "$RUNNER_TEMP/pathmc157/smoke" -- make check_lint
      - id: merge
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" merge-preview
          --repo "$GITHUB_WORKSPACE/upstream" --worktree "$GITHUB_WORKSPACE/upstream/.scratch/ci-preflight/pr-a2/candidate" --job-budget-s 3180 --reserve-s 240 --evidence "$RUNNER_TEMP/pathmc157/merge-preview"
      - id: worktree_sync
        if: steps.merge.outcome == 'success'
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" run-phase
          --name worktree-sync --cwd "$GITHUB_WORKSPACE/upstream/.scratch/ci-preflight/pr-a2/candidate" --timeout-s 420 --job-budget-s 3180 --reserve-s 240 --evidence "$RUNNER_TEMP/pathmc157/worktree-sync" -- uv sync --all-extras --locked
      - id: lint
        if: steps.worktree_sync.outcome == 'success'
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" run-phase
          --name lint --cwd "$GITHUB_WORKSPACE/upstream/.scratch/ci-preflight/pr-a2/candidate" --timeout-s 900 --job-budget-s 3180 --reserve-s 240 --evidence "$RUNNER_TEMP/pathmc157/lint" -- make lint
      - id: post_lint
        if: steps.lint.outcome == 'success'
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" checks
          --repo "$GITHUB_WORKSPACE/upstream" --worktree "$GITHUB_WORKSPACE/upstream/.scratch/ci-preflight/pr-a2/candidate" --receipt "$RUNNER_TEMP/pathmc157/merge-preview/receipt.json" --job-budget-s 3180 --reserve-s 240 --evidence "$RUNNER_TEMP/pathmc157/post-lint"
      - id: full_collection
        if: steps.post_lint.outcome == 'success'
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" collect
          --repo "$GITHUB_WORKSPACE/upstream/.scratch/ci-preflight/pr-a2/candidate" --durations "$GITHUB_WORKSPACE/upstream/.scratch/ci-preflight/pr-a2/candidate/.test_durations"
          --name full-collection --plan-n 6 --job-budget-s 3180 --reserve-s 240 --evidence "$RUNNER_TEMP/pathmc157/full-collection"
      - id: summarize
        if: always()
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" summarize --job merge-lint --evidence "$RUNNER_TEMP/pathmc157"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: "pathmc157-hosted-merge-lint-${{ github.run_id }}"
          path: "${{ runner.temp }}/pathmc157"
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Enforce product and harness result
        if: always()
        run: |
          test "${{ steps.full_collection.outcome }}" = success
          test "${{ steps.summarize.outcome }}" = success

  test-shard:
    name: test-shard-${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: packet
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pymc-labs/pathmc
          ref: 558fa990ca569708a542284e9c166dae136be4bd
          fetch-depth: 0
          persist-credentials: false
          path: upstream
      - id: py
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Mark job start
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" mark-start --evidence "$RUNNER_TEMP/pathmc157"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: false
      - id: prepare
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" prepare-candidate --repo "$GITHUB_WORKSPACE/upstream"
          --patch "$GITHUB_WORKSPACE/packet/validation/pathmc157/candidate-157.patch" --job-budget-s 3180 --reserve-s 240 --evidence "$RUNNER_TEMP/pathmc157/prepare"
      - id: sync
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" run-phase --name sync --cwd "$GITHUB_WORKSPACE/upstream"
          --timeout-s 420 --job-budget-s 3180 --reserve-s 240 --evidence "$RUNNER_TEMP/pathmc157/sync" -- uv sync --all-extras --locked
      - id: merge
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" merge-preview --repo "$GITHUB_WORKSPACE/upstream"
          --worktree "$GITHUB_WORKSPACE/upstream/.scratch/ci-preflight/pr-a2/candidate" --job-budget-s 3180 --reserve-s 240 --evidence "$RUNNER_TEMP/pathmc157/merge-preview"
      - id: worktree_sync
        if: steps.merge.outcome == 'success'
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" run-phase --name worktree-sync
          --cwd "$GITHUB_WORKSPACE/upstream/.scratch/ci-preflight/pr-a2/candidate" --timeout-s 420 --job-budget-s 3180 --reserve-s 240 --evidence "$RUNNER_TEMP/pathmc157/worktree-sync" -- uv sync --all-extras --locked
      - id: full_collection
        if: steps.worktree_sync.outcome == 'success'
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" collect
          --repo "$GITHUB_WORKSPACE/upstream/.scratch/ci-preflight/pr-a2/candidate" --durations "$GITHUB_WORKSPACE/upstream/.scratch/ci-preflight/pr-a2/candidate/.test_durations"
          --name full-collection --plan-n 6 --job-budget-s 3180 --reserve-s 240 --evidence "$RUNNER_TEMP/pathmc157/full-collection"
      - id: shard_collection
        if: steps.full_collection.outcome == 'success'
        continue-on-error: true
        env:
          SHARD: "${{ matrix.shard }}"
        run: |
          mapfile -t FILES < <("${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" plan-files --plan "$RUNNER_TEMP/pathmc157/full-collection/shard-plan.json" --shard "$SHARD")
          ARGS=(); for file in "${FILES[@]}"; do ARGS+=(--file "$file"); done
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" collect --repo "$GITHUB_WORKSPACE/upstream/.scratch/ci-preflight/pr-a2/candidate" --durations "$GITHUB_WORKSPACE/upstream/.scratch/ci-preflight/pr-a2/candidate/.test_durations" --name shard-collection --job-budget-s 3180 --reserve-s 240 --evidence "$RUNNER_TEMP/pathmc157/shard-collection" "${ARGS[@]}"
      - id: counted
        if: steps.shard_collection.outcome == 'success'
        continue-on-error: true
        env:
          SHARD: "${{ matrix.shard }}"
        run: |
          mapfile -t FILES < <("${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" plan-files --plan "$RUNNER_TEMP/pathmc157/full-collection/shard-plan.json" --shard "$SHARD")
          ARGS=(); for file in "${FILES[@]}"; do ARGS+=(--file "$file"); done
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" test-run --repo "$GITHUB_WORKSPACE/upstream/.scratch/ci-preflight/pr-a2/candidate" --evidence "$RUNNER_TEMP/pathmc157/counted" --shard "$SHARD" --job-budget-s 3180 --reserve-s 240 "${ARGS[@]}"
      - id: post_test
        if: steps.counted.outcome == 'success'
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" checks --final --repo "$GITHUB_WORKSPACE/upstream"
          --worktree "$GITHUB_WORKSPACE/upstream/.scratch/ci-preflight/pr-a2/candidate" --receipt "$RUNNER_TEMP/pathmc157/merge-preview/receipt.json" --job-budget-s 3180 --reserve-s 240 --evidence "$RUNNER_TEMP/pathmc157/post-test"
      - id: summarize
        if: always()
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" summarize --job test-shard --evidence "$RUNNER_TEMP/pathmc157"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: "pathmc157-hosted-test-shard-${{ matrix.shard }}-${{ github.run_id }}"
          path: "${{ runner.temp }}/pathmc157"
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Enforce product and harness result
        if: always()
        run: |
          test "${{ steps.post_test.outcome }}" = success
          test "${{ steps.summarize.outcome }}" = success

  coverage-combine:
    name: coverage-combine
    needs: [test-shard, merge-lint]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: packet
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pymc-labs/pathmc
          ref: 558fa990ca569708a542284e9c166dae136be4bd
          fetch-depth: 0
          persist-credentials: false
          path: upstream
      - id: py
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Mark job start
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" mark-start --evidence "$RUNNER_TEMP/pathmc157"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: pathmc157-hosted-*
          path: "${{ runner.temp }}/downloads"
      - id: prepare
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" prepare-candidate --repo "$GITHUB_WORKSPACE/upstream"
          --patch "$GITHUB_WORKSPACE/packet/validation/pathmc157/candidate-157.patch" --job-budget-s 3180 --reserve-s 240 --evidence "$RUNNER_TEMP/pathmc157/prepare"
      - id: sync
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" run-phase --name sync --cwd "$GITHUB_WORKSPACE/upstream" --timeout-s 420 --job-budget-s 3180 --reserve-s 240 --evidence "$RUNNER_TEMP/pathmc157/sync" -- uv sync --all-extras --locked
      - id: merge
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" merge-preview --repo "$GITHUB_WORKSPACE/upstream" --worktree "$GITHUB_WORKSPACE/upstream/.scratch/ci-preflight/pr-a2/candidate" --job-budget-s 3180 --reserve-s 240 --evidence "$RUNNER_TEMP/pathmc157/merge-preview"
      - id: worktree_sync
        if: steps.merge.outcome == 'success'
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" run-phase --name worktree-sync --cwd "$GITHUB_WORKSPACE/upstream/.scratch/ci-preflight/pr-a2/candidate" --timeout-s 420 --job-budget-s 3180 --reserve-s 240 --evidence "$RUNNER_TEMP/pathmc157/worktree-sync" -- uv sync --all-extras --locked
      - id: proof
        if: steps.worktree_sync.outcome == 'success'
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" coverage-proof --downloads "$RUNNER_TEMP/downloads" --job-budget-s 3180 --reserve-s 240 --evidence "$RUNNER_TEMP/pathmc157/coverage-proof"
      - id: combine
        if: steps.proof.outcome == 'success'
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" run-phase --name coverage-combine
          --cwd "$GITHUB_WORKSPACE/upstream/.scratch/ci-preflight/pr-a2/candidate" --timeout-s 600 --job-budget-s 3180 --reserve-s 240 --evidence "$RUNNER_TEMP/pathmc157/coverage-combine" -- bash -c
          'uv run --locked --all-extras coverage combine "$RUNNER_TEMP"/downloads/pathmc157-hosted-test-shard-*/counted/.coverage.shard-*'
      - id: report
        if: steps.combine.outcome == 'success'
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" run-phase --name coverage-report
          --cwd "$GITHUB_WORKSPACE/upstream/.scratch/ci-preflight/pr-a2/candidate" --timeout-s 600 --job-budget-s 3180 --reserve-s 240 --evidence "$RUNNER_TEMP/pathmc157/coverage-report" -- uv run --locked --all-extras coverage report
      - id: summarize
        if: always()
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" summarize --job coverage-combine --evidence "$RUNNER_TEMP/pathmc157"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: "pathmc157-hosted-coverage-combine-${{ github.run_id }}"
          path: "${{ runner.temp }}/pathmc157"
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Enforce product and harness result
        if: always()
        env:
          SHARD_RESULT: "${{ needs.test-shard.result }}"
          LINT_RESULT: "${{ needs.merge-lint.result }}"
        run: |
          test "$SHARD_RESULT" = success
          test "$LINT_RESULT" = success
          test "${{ steps.report.outcome }}" = success
          test "${{ steps.summarize.outcome }}" = success

  post-test:
    name: post-test
    needs: [freeze-docs, merge-lint, test-shard, coverage-combine]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: packet
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pymc-labs/pathmc
          ref: 558fa990ca569708a542284e9c166dae136be4bd
          fetch-depth: 0
          persist-credentials: false
          path: upstream
      - id: py
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Mark job start
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" mark-start --evidence "$RUNNER_TEMP/pathmc157"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: pathmc157-hosted-*
          path: "${{ runner.temp }}/downloads"
      - id: prepare
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" prepare-candidate --repo "$GITHUB_WORKSPACE/upstream"
          --patch "$GITHUB_WORKSPACE/packet/validation/pathmc157/candidate-157.patch" --job-budget-s 3180 --reserve-s 240 --evidence "$RUNNER_TEMP/pathmc157/prepare"
      - id: final
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" final-receipt --downloads "$RUNNER_TEMP/downloads"
          --repo "$GITHUB_WORKSPACE/upstream" --job-budget-s 3180 --reserve-s 240 --evidence "$RUNNER_TEMP/pathmc157/post-test"
      - id: summarize
        if: always()
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py" summarize --job post-test --evidence "$RUNNER_TEMP/pathmc157"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: "pathmc157-hosted-post-test-${{ github.run_id }}"
          path: "${{ runner.temp }}/pathmc157"
          if-no-files-found: error
          retention-days: 7
      - name: Enforce product and harness result
        if: always()
        env:
          FREEZE_RESULT: "${{ needs.freeze-docs.result }}"
          LINT_RESULT: "${{ needs.merge-lint.result }}"
          SHARD_RESULT: "${{ needs.test-shard.result }}"
          COVERAGE_RESULT: "${{ needs.coverage-combine.result }}"
        run: |
          test "$FREEZE_RESULT" = success
          test "$LINT_RESULT" = success
          test "$SHARD_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "${{ steps.final.outcome }}" = success
          test "${{ steps.summarize.outcome }}" = success

  freeze-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout packet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, path: packet}
      - name: Checkout upstream
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pymc-labs/pathmc
          ref: 558fa990ca569708a542284e9c166dae136be4bd
          fetch-depth: 0
          persist-credentials: false
          path: upstream
      - id: py
        name: Packet Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.11"}
      - name: Mark job start
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py"
          mark-start --evidence "$RUNNER_TEMP/pathmc157"
      - name: Project uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with: {enable-cache: false}
      - name: Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
      - id: prepare
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py"
          prepare-candidate --repo "$GITHUB_WORKSPACE/upstream"
          --patch "$GITHUB_WORKSPACE/packet/validation/pathmc157/candidate-157.patch"
          --evidence "$RUNNER_TEMP/pathmc157/prepare"
      - id: sync
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py"
          run-phase --name sync --cwd "$GITHUB_WORKSPACE/upstream" --timeout-s 420
          --evidence "$RUNNER_TEMP/pathmc157/sync" -- uv sync --all-extras --locked
      - id: freeze
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py"
          run-phase --name freeze --cwd "$GITHUB_WORKSPACE/upstream" --timeout-s 1200
          --job-budget-s 2640 --reserve-s 240
          --evidence "$RUNNER_TEMP/pathmc157/freeze" --make-target freeze-page
          --make-var PAGE=docs/examples/04-identification/sensitivity.qmd
      - name: Capture freeze outputs
        if: always()
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py"
          record-freeze --repo "$GITHUB_WORKSPACE/upstream"
          --evidence "$RUNNER_TEMP/pathmc157/freeze-output"
      - id: editable
        if: steps.freeze.outcome == 'success'
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py"
          run-phase --name editable --cwd "$GITHUB_WORKSPACE/upstream" --timeout-s 60
          --evidence "$RUNNER_TEMP/pathmc157/editable" -- uv run --locked --all-extras python -c
          "import pathmc; print(pathmc.__file__)"
      - id: docs
        if: steps.editable.outcome == 'success'
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py"
          run-phase --name docs --cwd "$GITHUB_WORKSPACE/upstream" --timeout-s 900
          --job-budget-s 2640 --reserve-s 240
          --evidence "$RUNNER_TEMP/pathmc157/docs" --make-target docs
      - name: Collect rendered documentation
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/pathmc157/rendered"
          find "$GITHUB_WORKSPACE/upstream/great-docs/_site" -type f \( -name 'sensitivity*.html' -o -name '*sensitivity*png' -o -name 'llms.txt' -o -name 'llms-full.txt' -o -name 'skill.md' \) -exec cp --parents '{}' "$RUNNER_TEMP/pathmc157/rendered" \; 2>/dev/null || true
          test -s "$GITHUB_WORKSPACE/upstream/great-docs/_site/llms.txt"
          test -s "$GITHUB_WORKSPACE/upstream/great-docs/_site/llms-full.txt"
          test -s "$GITHUB_WORKSPACE/upstream/great-docs/_site/skill.md"
      - id: summarize
        if: always()
        continue-on-error: true
        run: >-
          "${{ steps.py.outputs.python-path }}" -I -B "$GITHUB_WORKSPACE/packet/validation/pathmc157/hv_step.py"
          summarize --job freeze-docs --evidence "$RUNNER_TEMP/pathmc157"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pathmc157-hosted-freeze-docs-${{ github.run_id }}
          path: ${{ runner.temp }}/pathmc157
          if-no-files-found: error
          retention-days: 7
      - name: Enforce product and harness result
        if: always()
        run: |
          test "${{ steps.prepare.outcome }}" = success
          test "${{ steps.sync.outcome }}" = success
          test "${{ steps.freeze.outcome }}" = success
          test "${{ steps.editable.outcome }}" = success
          test "${{ steps.docs.outcome }}" = success
          test "${{ steps.summarize.outcome }}" = success
